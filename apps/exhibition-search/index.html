<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>노션 전시 DB 자동 입력</title>
  <link rel="stylesheet" href="../shared/search-app.css" />
  <style>:root { --accent: #be123c; --accent-soft: #fff1f2; --accent-border: #fecdd3; }</style>
</head>
<body>
  <main class="container">
    <h3>🖼️ 노션 전시 DB 자동 입력</h3>
    <div class="row">
      <input id="query" placeholder="전시명 또는 전시 장소를 입력하세요" />
      <button id="searchBtn" type="button">검색</button>
    </div>
    <div class="date-row">
      <input id="startDate" type="date" aria-label="검색 시작일" />
      <span>부터</span>
      <input id="endDate" type="date" aria-label="검색 종료일" />
      <span>까지</span>
    </div>
    <div class="hint">✅ 전시명, 미술관 이름 또는 기간으로 검색할 수 있습니다.</div>
    <div id="auth"></div>
    <div id="error" class="err" aria-live="polite"></div>
    <section id="results"></section>
  </main>

  <script src="../shared/admin-auth.js"></script>
  <script>
    const WORKER_URL = "https://notion-exhibition-automation-new.codud9028.workers.dev";
    const auth = createAdminAuth({ mountId: "auth", storageKey: "NOTION_ADMIN_TOKEN", legacyKeys: ["EXHIBITION_ADMIN_TOKEN"] });
    const queryInput = document.getElementById("query");
    const startDate = document.getElementById("startDate");
    const endDate = document.getElementById("endDate");
    const searchBtn = document.getElementById("searchBtn");
    const results = document.getElementById("results");
    const errorBox = document.getElementById("error");

    const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
    })[char]);
    const normalizeImageUrl = value => {
      if (!value) return "";
      try {
        const url = new URL(String(value).replace(/^http:/, "https:"));
        return url.protocol === "https:" ? url.href : "";
      } catch (_) { return ""; }
    };
    const setError = message => { errorBox.textContent = message || ""; };
    const decodeEntities = value => {
      const parser = document.createElement("textarea");
      parser.innerHTML = String(value || "");
      const once = parser.value;
      parser.innerHTML = once;
      return parser.value;
    };
    const formatDate = value => {
      const digits = String(value || "").replace(/\D/g, "");
      return digits.length === 8 ? `${digits.slice(0, 4)}.${digits.slice(4, 6)}.${digits.slice(6, 8)}` : (value || "-");
    };

    function setDefaultDates() {
      const today = new Date();
      const earlier = new Date(today);
      const later = new Date(today);
      earlier.setFullYear(earlier.getFullYear() - 1);
      later.setFullYear(later.getFullYear() + 1);
      const localDate = date => {
        const offset = date.getTimezoneOffset() * 60000;
        return new Date(date.getTime() - offset).toISOString().slice(0, 10);
      };
      startDate.value = localDate(earlier);
      endDate.value = localDate(later);
    }

    function renderExhibitions(items) {
      if (!items.length) {
        results.innerHTML = '<div class="hint">검색 결과가 없습니다.</div>';
        return;
      }
      results.innerHTML = items.map((item, index) => {
        const image = normalizeImageUrl(item.imageUrl);
        return `
          <article class="card">
            <div class="media-wrap">🖼️${image ? `<img src="${escapeHtml(image)}" alt="${escapeHtml(item.title)} 포스터" loading="lazy" />` : ""}</div>
            <div class="info">
              <span class="badge">전시</span>
              <div class="title">${escapeHtml(decodeEntities(item.title) || "제목 없음")}</div>
              <div class="meta">📍 <strong>장소:</strong> ${escapeHtml(item.place || "-")}</div>
              <div class="meta">📅 <strong>기간:</strong> ${escapeHtml(formatDate(item.startDate))} ~ ${escapeHtml(formatDate(item.endDate))}</div>
            </div>
            <div class="actions">
              <div>
                <button class="add-btn" type="button" data-index="${index}">노션에 추가</button>
                <div class="card-status" aria-live="polite"></div>
              </div>
            </div>
          </article>`;
      }).join("");

      results.querySelectorAll("img").forEach(image => {
        image.addEventListener("error", () => image.remove(), { once: true });
      });
      results.querySelectorAll(".add-btn").forEach(button => {
        button.addEventListener("click", () => addToNotion(items[Number(button.dataset.index)], button));
      });
    }

    async function search() {
      const query = queryInput.value.trim();
      if (!query) return setError("검색어를 입력해 주세요.");
      const params = new URLSearchParams({
        q: query,
        from: startDate.value.replaceAll("-", ""),
        to: endDate.value.replaceAll("-", "")
      });
      setError("");
      searchBtn.disabled = true;
      searchBtn.textContent = "검색 중…";
      results.innerHTML = '<div class="hint">전시 정보를 찾고 있습니다…</div>';
      try {
        const response = await fetch(`${WORKER_URL}/search?${params}`);
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || "검색 요청에 실패했습니다.");
        renderExhibitions(Array.isArray(data) ? data : (data.items || data.results || []));
      } catch (error) {
        results.innerHTML = "";
        setError(error.message);
      } finally {
        searchBtn.disabled = false;
        searchBtn.textContent = "검색";
      }
    }

    async function addToNotion(item, button) {
      const token = auth.getToken();
      const status = button.parentElement.querySelector(".card-status");
      status.classList.remove("error");
      if (!token) {
        auth.showStatus("먼저 관리자 토큰을 입력하고 인증 저장을 눌러 주세요.", true);
        document.querySelector(".auth-token").focus();
        return;
      }
      button.disabled = true;
      button.textContent = "추가 중…";
      status.textContent = "";
      try {
        const response = await fetch(`${WORKER_URL}/add`, {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Admin-Token": token },
          body: JSON.stringify({
            seq: item.seq,
            title: item.title,
            place: item.place,
            period: `${formatDate(item.startDate)} ~ ${formatDate(item.endDate)}`,
            imageUrl: item.imageUrl
          })
        });
        const data = await response.json().catch(() => ({}));
        if (response.status === 401) {
          auth.forget("인증이 만료되었거나 토큰이 올바르지 않습니다. 다시 저장해 주세요.");
          throw new Error("인증 정보를 확인해 주세요.");
        }
        if (!response.ok) throw new Error(data.error || "노션 추가에 실패했습니다.");
        status.textContent = "추가 완료";
        button.textContent = "추가됨";
      } catch (error) {
        status.textContent = error.message;
        status.classList.add("error");
        button.disabled = false;
        button.textContent = "다시 추가";
      }
    }

    setDefaultDates();
    searchBtn.addEventListener("click", search);
    queryInput.addEventListener("keydown", event => { if (event.key === "Enter") search(); });
  </script>
</body>
</html>

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>노션 도서 DB 자동 입력</title>
  <link rel="stylesheet" href="../shared/search-app.css" />
  <style>:root { --accent: #047857; --accent-soft: #ecfdf5; --accent-border: #a7f3d0; }</style>
</head>
<body>
  <main class="container">
    <h3>📚 노션 도서 DB 자동 입력</h3>
    <div class="row">
      <input id="query" placeholder="책 제목, 작가 또는 ISBN을 입력하세요" />
      <button id="searchBtn" type="button">검색</button>
    </div>
    <div class="hint">✅ 예: 데미안, 한강, 9788937460449</div>
    <div id="auth"></div>
    <div id="error" class="err" aria-live="polite"></div>
    <section id="results"></section>
  </main>

  <script src="../shared/admin-auth.js"></script>
  <script>
    const WORKER_URL = "https://notion-book-automation-new.codud9028.workers.dev";
    const auth = createAdminAuth({ mountId: "auth", storageKey: "BOOK_ADMIN_TOKEN" });
    const queryInput = document.getElementById("query");
    const searchBtn = document.getElementById("searchBtn");
    const results = document.getElementById("results");
    const errorBox = document.getElementById("error");

    const escapeHtml = value => String(value ?? "").replace(/[&<>"']/g, char => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
    })[char]);
    const looksLikeIsbn = value => /^\d{13}$/.test(value.replace(/[-\s]/g, "")) || /^\d{9}[\dXx]$/.test(value.replace(/[-\s]/g, ""));
    const normalizeImageUrl = value => {
      if (!value) return "";
      try {
        const url = new URL(String(value).replace(/^http:/, "https:"));
        return url.protocol === "https:" ? url.href : "";
      } catch (_) { return ""; }
    };
    const setError = message => { errorBox.textContent = message || ""; };

    function renderBooks(items) {
      if (!items.length) {
        results.innerHTML = '<div class="hint">검색 결과가 없습니다.</div>';
        return;
      }
      results.innerHTML = items.map((book, index) => {
        const cover = normalizeImageUrl(book.coverUrl);
        return `
          <article class="card">
            <div class="media-wrap">📖${cover ? `<img src="${escapeHtml(cover)}" alt="${escapeHtml(book.title)} 표지" loading="lazy" />` : ""}</div>
            <div class="info">
              <span class="badge">도서</span>
              <div class="title">${escapeHtml(book.title || "제목 없음")}</div>
              <div class="meta">✍️ <strong>저자:</strong> ${escapeHtml(book.author || "-")}</div>
              <div class="meta">🏢 <strong>출판사:</strong> ${escapeHtml(book.publisher || "-")}</div>
              <div class="meta">🏷️ <strong>KDC:</strong> ${escapeHtml(book.kdc || "-")} · <strong>ISBN:</strong> ${escapeHtml(book.isbn13 || "-")}</div>
            </div>
            <div class="actions">
              <div>
                <button class="add-btn" type="button" data-index="${index}">노션에 추가</button>
                <div class="card-status" aria-live="polite"></div>
              </div>
            </div>
          </article>`;
      }).join("");

      results.querySelectorAll("img").forEach(image => {
        image.addEventListener("error", () => image.remove(), { once: true });
      });
      results.querySelectorAll(".add-btn").forEach(button => {
        button.addEventListener("click", () => addToNotion(items[Number(button.dataset.index)], button));
      });
    }

    async function search() {
      const query = queryInput.value.trim();
      if (!query) return setError("검색어를 입력해 주세요.");
      setError("");
      searchBtn.disabled = true;
      searchBtn.textContent = "검색 중…";
      results.innerHTML = '<div class="hint">도서 정보를 찾고 있습니다…</div>';
      try {
        const key = looksLikeIsbn(query) ? "isbn13" : "keyword";
        const normalizedQuery = key === "isbn13" ? query.replace(/[-\s]/g, "") : query;
        const response = await fetch(`${WORKER_URL}/search?${key}=${encodeURIComponent(normalizedQuery)}`);
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || "검색 요청에 실패했습니다.");
        renderBooks(Array.isArray(data) ? data : (data.items || data.results || []));
      } catch (error) {
        results.innerHTML = "";
        setError(error.message);
      } finally {
        searchBtn.disabled = false;
        searchBtn.textContent = "검색";
      }
    }

    async function addToNotion(book, button) {
      const token = auth.getToken();
      const status = button.parentElement.querySelector(".card-status");
      status.classList.remove("error");
      if (!token) {
        auth.showStatus("먼저 관리자 토큰을 입력하고 인증 저장을 눌러 주세요.", true);
        document.querySelector(".auth-token").focus();
        return;
      }
      button.disabled = true;
      button.textContent = "추가 중…";
      status.textContent = "";
      try {
        const response = await fetch(`${WORKER_URL}/add`, {
          method: "POST",
          headers: { "Content-Type": "application/json", "X-Admin-Token": token },
          body: JSON.stringify({ ...book, isbn13: book.isbn13 || "", __titleProp: "제목" })
        });
        const data = await response.json().catch(() => ({}));
        if (response.status === 401) {
          auth.forget("인증이 만료되었거나 토큰이 올바르지 않습니다. 다시 저장해 주세요.");
          throw new Error("인증 정보를 확인해 주세요.");
        }
        if (!response.ok) throw new Error(data.error || "노션 추가에 실패했습니다.");
        status.textContent = "추가 완료";
        button.textContent = "추가됨";
      } catch (error) {
        status.textContent = error.message;
        status.classList.add("error");
        button.disabled = false;
        button.textContent = "다시 추가";
      }
    }

    searchBtn.addEventListener("click", search);
    queryInput.addEventListener("keydown", event => { if (event.key === "Enter") search(); });
  </script>
</body>
</html>
